<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161a">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap">
<title>Blade Log</title>
<style>

:root{
    --bg: #14161a;
    --panel: #1c1f24;
    --panel-raised: #23262c;
    --line: #33383f;
    --text: #e8e6e0;
    --text-dim: #8b8f96;
    --text-faint: #5a5e64;
    --accent: #c97a4a;
    --accent-dim: #8f5a38;
    --blue: #5b7c99;
    --muted: #6b6455;
    --owned: #6f9a76;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:28px 20px 16px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0;
    background:var(--bg);
    z-index:10;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:0.02em;
    font-size:1.6rem;
    margin:0 0 2px;
    text-transform:uppercase;
  }
  .sub{
    color:var(--text-dim);
    font-size:0.8rem;
    letter-spacing:0.03em;
  }
  .toolbar{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
    align-items:center;
  }
  .toolbar-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    width:100%;
  }
  .filter-btn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .filter-btn.active{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(201,122,74,0.08);
  }
  .filter-btn.status-active.active{ border-color:var(--blue); color:var(--blue); background:rgba(91,124,153,0.08); }
  .add-btn{
    margin-left:auto;
    background:var(--accent);
    color:#1a1310;
    border:none;
    font-weight:600;
  }

  main{ padding:16px 16px 0; max-width:640px; margin:0 auto; }

  #form-panel{
    display:none;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    margin-bottom:20px;
  }
  #form-panel.open{ display:block; }
  .section-label{
    font-size:0.65rem; color:var(--text-faint); text-transform:uppercase;
    letter-spacing:0.06em; margin:14px 0 8px; border-top:1px solid var(--line); padding-top:12px;
  }
  .section-label:first-child{ margin-top:0; border-top:none; padding-top:0; }
  .field-row{ display:flex; gap:8px; margin-bottom:10px; }
  .field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .field label{
    font-size:0.65rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  input, select, textarea{
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 9px;
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  .priority-picker{ display:flex; gap:6px; }
  .blade-toggle{
    flex:1;
    height:34px;
    border:1px solid var(--line);
    background:var(--panel-raised);
    border-radius:3px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .blade-toggle svg{ opacity:0.35; }
  .blade-toggle.sel{ border-color:var(--accent); background:rgba(201,122,74,0.1); }
  .blade-toggle.sel svg{ opacity:1; }
  .seg{ display:flex; gap:6px; }
  .seg-opt{
    flex:1; text-align:center; padding:8px;
    border:1px solid var(--line); border-radius:3px;
    cursor:pointer; font-size:0.78rem; color:var(--text-dim);
    background:var(--panel-raised);
  }
  .seg-opt.sel-blue.sel{ border-color:var(--blue); color:var(--blue); background:rgba(91,124,153,0.1); }
  .seg-opt.sel-accent.sel{ border-color:var(--accent); color:var(--accent); background:rgba(201,122,74,0.1); }
  .seg-opt.sel-muted.sel{ border-color:var(--muted); color:#c9b280; background:rgba(107,100,85,0.12); }
  .seg-opt.sel-owned.sel{ border-color:var(--owned); color:var(--owned); background:rgba(111,154,118,0.12); }

  .owned-block{ display:none; }
  .owned-block.open{ display:block; }

  .variation-block{ display:none; }
  .variation-block.open{ display:block; }
  .passed-block{ display:none; }
  .passed-block.open{ display:block; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip{
    font-size:0.68rem; padding:4px 9px; border-radius:12px;
    border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
    background:var(--panel-raised);
  }
  .chip:hover{ border-color:var(--muted); color:#c9b280; }

  .form-actions{ display:flex; gap:8px; margin-top:16px; }
  .btn{
    padding:9px 16px; border-radius:3px; border:1px solid var(--line);
    background:var(--panel-raised); color:var(--text);
    font-family:'IBM Plex Mono', monospace; font-size:0.8rem; cursor:pointer;
  }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#1a1310; font-weight:600; flex:1; }
  .btn-cancel{ color:var(--text-dim); }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:4px;
    padding:14px 14px 12px;
    margin-bottom:10px;
  }
  .card.p5{ border-left-color:var(--accent); }
  .card.p4{ border-left-color:#b8895f; }
  .card.passed{ border-left-color:var(--muted); opacity:0.72; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-thumb{ width:100%; max-height:280px; object-fit:contain; border-radius:6px; margin-bottom:10px; border:1px solid var(--line); display:block; background:var(--panel-raised); cursor:zoom-in; }
  .card-extra-thumb{ cursor:zoom-in; }
  .card-title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:1.02rem; line-height:1.25; }
  .card-model{ color:var(--text-dim); font-size:0.78rem; }
  .card-variation{ color:#c9b280; font-size:0.72rem; margin-top:3px; line-height:1.5; }
  .card-notes{ color:var(--text-faint); font-size:0.72rem; margin-top:2px; font-style:italic; }
  .added-date{ color:var(--text-faint); font-size:0.7rem; margin-left:auto; margin-right:8px; align-self:center; }
  .card-price{ font-size:1.05rem; color:var(--accent); font-weight:600; white-space:nowrap; }
  .card.passed .card-price{ color:var(--text-dim); }
  .card-meta{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .badge{
    font-size:0.65rem; text-transform:uppercase; letter-spacing:0.04em;
    padding:3px 7px; border-radius:2px; border:1px solid var(--line); color:var(--text-dim);
  }
  .badge.new{ border-color:var(--blue); color:var(--blue); }
  .badge.pre{ border-color:#7d7050; color:#c9b280; }
  .badge.passed-badge{ border-color:var(--muted); color:#c9b280; }
  .badge.comps-badge{ border-color:var(--blue); color:var(--blue); }
  .badge.owned-badge{ border-color:var(--owned); color:var(--owned); }
  .card.owned{ border-left-color:var(--owned); }
  .owned-line{ font-size:0.72rem; color:var(--owned); margin-top:6px; }
  .vendor{ font-size:0.78rem; color:var(--text-dim); }
  .reason-line{ font-size:0.72rem; color:#c9b280; margin-top:6px; }
  .card-actions{ margin-left:auto; display:flex; gap:10px; }
  .card-actions button{
    background:none; border:none; color:var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem;
    cursor:pointer; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 0;
  }
  .card-actions button:hover{ color:var(--text); }
  .priority-mini{ display:flex; gap:2px; align-items:center; }

  .empty{
    text-align:center; color:var(--text-dim); padding:60px 20px;
    font-size:0.85rem; line-height:1.6;
  }
  .empty b{ color:var(--text); }

  ::placeholder{ color:#5a5e64; }

/* ---- merged-app additions ---------------------------------------- */
/* Declare the scheme explicitly. Without this, browser auto-dark-mode and
   dark-mode extensions try to "convert" an already-dark page and can invert
   text into the background. Fallback literals sit before each var() so the
   page stays readable even if a custom property fails to resolve. */
:root{color-scheme:dark}
html{background:#14161a}
*{box-sizing:border-box}
body{margin:0;
  background:#14161a;background:var(--bg,#14161a);
  color:#e8e6e0;color:var(--text,#e8e6e0);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;forced-color-adjust:none}
header{position:sticky;top:0;z-index:30;
  background:#1c1f24;background:var(--panel,#1c1f24);
  border-bottom:1px solid var(--line,#33383f);padding:10px 14px 8px;
  padding-top:calc(10px + env(safe-area-inset-top))}
.hdr-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.sub{font-size:.76rem;color:var(--text-dim);margin:3px 0 8px}
.sub b{color:var(--text);font-weight:600}
main{padding:12px 14px 60px;max-width:1400px;margin:0 auto}

.storage-state{margin-left:auto;font-size:.68rem;padding:3px 8px;border-radius:10px;
  border:1px solid var(--line);white-space:nowrap}
.storage-state.ok{color:var(--owned);border-color:var(--owned)}
.storage-state.warn{color:var(--accent);border-color:var(--accent-dim)}
.storage-state.bad{color:#d97070;border-color:#7a3d3d}

.toolbar{display:flex;flex-direction:column;gap:6px}
.toolbar-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#search{flex:1;min-width:200px;background:var(--panel-raised);border:1px solid var(--line);
  color:var(--text);border-radius:6px;padding:7px 10px;font-size:.85rem}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
select.filter-btn{padding-right:6px}

.ms-wrap{position:relative}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:50;width:270px;
  background:var(--panel-raised);border:1px solid var(--line);border-radius:8px;padding:8px;
  box-shadow:0 10px 28px rgba(0,0,0,.5)}
.ms-panel input[type=search]{width:100%;background:var(--panel);border:1px solid var(--line);
  color:var(--text);border-radius:5px;padding:5px 8px;font-size:.8rem;margin-bottom:6px}
.ms-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.ms-list label{display:flex;gap:7px;align-items:center;font-size:.78rem;padding:3px 4px;
  border-radius:4px;cursor:pointer}
.ms-list label:hover{background:var(--panel)}
.ms-clear{width:100%;margin-top:6px;background:none;border:1px solid var(--line);color:var(--text-dim);
  border-radius:5px;padding:5px;font-size:.75rem;cursor:pointer}
.ms-count{color:var(--accent);font-size:.72rem}

.result-count{font-size:.74rem;color:var(--text-faint);margin:2px 0 10px}
#cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(390px,1fr))}
@media(max-width:640px){#cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px}
.card.pulse{animation:pulse 1.5s ease}
@keyframes pulse{0%,100%{border-color:var(--line)}30%{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,122,74,.18)}}
.card-top{display:flex;gap:11px;align-items:flex-start}
.card-thumb{width:74px;height:74px;flex:0 0 74px;border-radius:6px;overflow:hidden;
  background:var(--panel-raised);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.card-thumb img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.thumb-none,.thumb-ph{font-size:.6rem;color:var(--text-faint);text-align:center}
.thumb-ph{width:100%;height:100%;background:linear-gradient(100deg,var(--panel-raised) 30%,var(--line) 50%,var(--panel-raised) 70%);
  background-size:220% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
.card-title{flex:1;min-width:0}
.card-model{font-weight:650;font-size:.94rem;line-height:1.25}
.card-variation{font-size:.78rem;color:var(--text-dim);margin-top:2px;line-height:1.3}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:.72rem}
.card-meta.small{color:var(--text-faint)}
.card-meta.small span:not(:last-child):after{content:' ·';color:var(--text-faint)}
.maker{color:var(--accent);font-weight:600}
.designer{color:var(--text-dim);font-style:italic}
.card-price{text-align:right;flex:0 0 auto}
.price{font-weight:650;font-size:.92rem}
.vendor{font-size:.7rem;color:var(--text-faint);margin-top:2px}
.card-notes{font-size:.76rem;color:var(--text-dim);margin-top:8px;line-height:1.45;
  border-top:1px solid var(--line);padding-top:7px}
.card-extra{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.card-extra-thumb{width:46px;height:46px;object-fit:cover;border-radius:4px;
  border:1px solid var(--line);cursor:zoom-in}
.card-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.card-actions button,.card-actions .lnk{background:none;border:1px solid var(--line);
  color:var(--text-dim);border-radius:5px;padding:4px 9px;font-size:.73rem;cursor:pointer;
  text-decoration:none;display:inline-block}
.card-actions button:hover,.card-actions .lnk:hover{border-color:var(--accent);color:var(--accent)}
.card-detail{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:.76rem}
.detail-grid dt{color:var(--text-faint)}
.detail-grid dd{margin:0;color:var(--text)}
.related{margin-top:9px;font-size:.76rem}
.related ul{margin:4px 0 0;padding-left:16px}
.related a{color:var(--accent)}
.status-history{margin-top:9px;font-size:.76rem}
.status-history ul{margin:4px 0 0;padding-left:16px;list-style:disc}
.status-history li{margin-bottom:2px}
.sh-date{color:var(--text-faint);font-variant-numeric:tabular-nums;margin-right:3px}
.sh-note{display:block;color:var(--text-dim);font-style:italic;margin-left:2px}

.comp-badge{display:inline-block;font-size:.68rem;color:var(--blue);
  border:1px solid var(--blue);border-radius:9px;padding:1px 8px;margin:5px 4px 0 0;
  background:rgba(91,124,153,.1)}
.comp-block{margin-top:9px;font-size:.76rem;border-top:1px solid var(--line);padding-top:8px}
.comp-block ul{margin:4px 0 0;padding-left:16px}
.comp-block a{color:var(--accent)}
.comp-stats{color:var(--blue);margin-top:3px;font-weight:600}
.comp-selected{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;min-height:20px}
.comp-chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;
  background:var(--panel-raised);border:1px solid var(--blue);color:var(--text);
  border-radius:12px;padding:3px 6px 3px 10px}
.comp-chip button{background:var(--blue);color:#fff;border:none;border-radius:50%;
  width:16px;height:16px;font-size:.7rem;line-height:1;cursor:pointer;padding:0}
.comp-list{max-height:230px;overflow-y:auto;margin-top:6px;
  border:1px solid var(--line);border-radius:6px;padding:4px}
.comp-list label{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;
  border-radius:5px;cursor:pointer;font-size:.76rem}
.comp-list label:hover{background:var(--panel-raised)}
.comp-opt em{color:var(--text-dim);font-style:normal}
.comp-opt-meta{display:block;color:var(--text-faint);font-size:.68rem;margin-top:1px}

.cz-badge{display:inline-block;font-size:.68rem;color:#a98bc4;border:1px solid #6d5580;
  border-radius:9px;padding:1px 8px;margin:5px 4px 0 0;background:rgba(169,139,196,.1)}
.cz-block{margin-top:9px;font-size:.76rem;border-top:1px solid var(--line);padding-top:8px}
.cz-block ul{margin:4px 0 0;padding-left:16px}
.cz-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.cz-row{display:flex;align-items:flex-start;gap:9px;background:var(--panel-raised);
  border:1px solid var(--line);border-left:3px solid #6d5580;border-radius:6px;padding:6px 9px;font-size:.78rem}
.cz-date{color:var(--text-faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.cz-note{flex:1;min-width:0}
.cz-row button{background:none;border:none;color:var(--text-faint);cursor:pointer;
  font-size:1rem;line-height:1;padding:0 2px}
.cz-row button:hover{color:var(--accent)}
.cz-add{align-items:flex-end}
.cz-add .btn{flex:0 0 auto;white-space:nowrap}

.badge{font-size:.66rem;padding:2px 7px;border-radius:9px;border:1px solid var(--line);
  color:var(--text-dim);white-space:nowrap}
.badge.new{color:var(--owned);border-color:var(--owned)}
.badge.pre{color:var(--blue);border-color:var(--blue)}
.st-target{color:var(--accent);border-color:var(--accent-dim)}
.st-owned{color:var(--owned);border-color:var(--owned)}
.st-comps{color:var(--blue);border-color:var(--blue)}
.st-sell{color:#c9a227;border-color:#8a6f1c}
.st-sold{color:#7fae9e;border-color:#3f6a5e;background:rgba(127,174,158,.08)}
.st-custom{color:#a98bc4;border-color:#6d5580}
.st-passed,.st-returned{color:var(--text-faint)}
.flag{display:inline-block;font-size:.66rem;color:var(--accent);border:1px dashed var(--accent-dim);
  border-radius:9px;padding:1px 7px;margin:5px 4px 0 0}
.priority-mini{display:inline-flex;gap:1px;align-items:center}

#table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.78rem}
thead th{position:sticky;top:0;background:var(--panel-raised);text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  color:var(--text-dim);font-weight:600}
thead th[data-sk]{cursor:pointer}
thead th[data-sk]:hover{color:var(--accent)}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--panel)}
.t-model{font-weight:600}
.t-var{color:var(--text-faint);font-size:.72rem;margin-top:1px}
.t-photo img{width:40px;height:40px;object-fit:cover;border-radius:4px;cursor:zoom-in}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody button{background:none;border:1px solid var(--line);color:var(--text-dim);
  border-radius:5px;padding:3px 8px;font-size:.72rem;cursor:pointer}

#form-panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:14px;margin-bottom:16px}
.field input,.field select,.field textarea{width:100%;background:var(--panel-raised);
  border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;
  font-size:.85rem;font-family:inherit}
.field textarea{resize:vertical}
.hint{font-size:.73rem;color:var(--text-dim)}
.check{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--text-dim)}
.form-preview{max-height:90px;border-radius:6px;border:1px solid var(--line);margin-top:6px}
.extra-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.extra-preview .ex{position:relative;display:inline-block}
.extra-preview img{height:56px;width:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.extra-preview button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;
  border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:.7rem;cursor:pointer;line-height:1}
.priority-picker{display:flex;gap:3px;align-items:center}
.pri{background:none;border:none;cursor:pointer;padding:2px}
.pri-clear{background:none;border:none;color:var(--text-faint);font-size:.7rem;cursor:pointer;margin-left:4px}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#lightbox-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;
  background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;line-height:1}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-hdr h2{margin:0;font-size:1rem}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:1.5rem;cursor:pointer;line-height:1}
.modal-body{padding:14px;overflow-y:auto}
.modal-body textarea{width:100%;background:var(--panel-raised);border:1px solid var(--line);
  color:var(--text);border-radius:6px;padding:9px;font-family:ui-monospace,Menlo,monospace;
  font-size:.7rem;margin-top:8px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;
  border-top:1px solid var(--line);flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));background:var(--panel-raised);
  border:1px solid var(--accent-dim);color:var(--text);padding:9px 16px;border-radius:8px;
  font-size:.8rem;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.empty{color:var(--text-faint);text-align:center;padding:44px 0;font-size:.86rem}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <h1>Blade Log</h1>
    <div id="storage-state" class="storage-state" title="Where your edits are being saved">checking storage…</div>
  </div>
  <div class="sub" id="stats-line">loading…</div>

  <div class="toolbar">
    <div class="toolbar-row" id="status-filters">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="Target">Targets</button>
      <button class="filter-btn" data-status="Collection">Collection</button>
      <button class="filter-btn" data-status="Comps">Comps</button>
      <button class="filter-btn" data-status="Sell">Sell</button>
      <button class="filter-btn" data-status="Sold">Sold</button>
      <button class="filter-btn" data-status="Passed">Passed</button>
      <button class="filter-btn" data-status="Returned">Returned</button>
    </div>

    <div class="toolbar-row">
      <input type="search" id="search" placeholder="Search maker, model, steel, vendor, order #, notes…">
    </div>

    <div class="toolbar-row">
      <div class="seg" id="cat-filters">
        <button class="seg-opt active" data-cat="all">All types</button>
        <button class="seg-opt" data-cat="Knife">Knives</button>
        <button class="seg-opt" data-cat="Accessory">Accessories</button>
        <button class="seg-opt" data-cat="Custom">Custom</button>
      </div>
      <div class="ms-wrap">
        <button class="filter-btn" id="maker-btn">Maker <span class="ms-count" id="maker-count"></span> ▾</button>
        <div class="ms-panel" id="maker-panel" hidden>
          <input type="search" id="maker-search" placeholder="Find maker…">
          <div class="ms-list" id="maker-list"></div>
          <button class="ms-clear" id="maker-clear">Clear makers</button>
        </div>
      </div>
      <div class="ms-wrap">
        <button class="filter-btn" id="vendor-btn">Vendor <span class="ms-count" id="vendor-count"></span> ▾</button>
        <div class="ms-panel" id="vendor-panel" hidden>
          <input type="search" id="vendor-search" placeholder="Find vendor…">
          <div class="ms-list" id="vendor-list"></div>
          <button class="ms-clear" id="vendor-clear">Clear vendors</button>
        </div>
      </div>
      <div class="ms-wrap">
        <button class="filter-btn" id="designer-btn">Designer <span class="ms-count" id="designer-count"></span> ▾</button>
        <div class="ms-panel" id="designer-panel" hidden>
          <input type="search" id="designer-search" placeholder="Find designer…">
          <div class="ms-list" id="designer-list"></div>
          <button class="ms-clear" id="designer-clear">Clear designers</button>
        </div>
      </div>
      <button class="filter-btn" id="flag-btn" title="Records the merge flagged for your review">⚑ Needs review</button>
      <button class="filter-btn" id="cz-filter-btn" title="Only items that have been customized">✦ Customized</button>
    </div>

    <div class="toolbar-row">
      <div class="seg" id="view-toggle">
        <button class="seg-opt active" data-view="cards">Cards</button>
        <button class="seg-opt" data-view="table">Table</button>
      </div>
      <select id="sort-by" class="filter-btn">
        <option value="dateAdded-desc">Newest first</option>
        <option value="dateAdded-asc">Oldest first</option>
        <option value="maker-asc">Maker A–Z</option>
        <option value="model-asc">Model A–Z</option>
        <option value="price-desc">Price high–low</option>
        <option value="price-asc">Price low–high</option>
        <option value="priority-desc">Priority high–low</option>
      </select>
      <button class="filter-btn add-btn" id="add-toggle">+ Add item</button>
      <button class="filter-btn" id="export-btn">⬇ Back up</button>
      <button class="filter-btn" id="import-btn">⬆ Restore</button>
    </div>
  </div>
</header>

<main>
  <div id="form-panel" hidden>
    <div class="section-label" style="margin-top:0;border-top:none;padding-top:0;">Quick fill</div>
    <div class="field-row">
      <div class="field">
        <label>Paste a spec block in "Label: value" format, one per line</label>
        <textarea id="f-quickfill" rows="5" placeholder="Maker: Hawk Knives&#10;Model: Talon&#10;Variation: Brightwashed Titanium / Ocean Blue Glass&#10;Designer: (if not the maker)&#10;Steel: M390&#10;Handle: Titanium, Ocean Blue Glass&#10;Finish: Brightwashed&#10;Blade Length: 3.375&quot;&#10;Price: $950&#10;Vendor: Recon One&#10;Link: https://…&#10;Condition: New&#10;Status: Collection&#10;Order #: 10432&#10;Purchase Date: 2026-07-20&#10;Price Paid: $950"></textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:0;margin-bottom:6px;align-items:center;">
      <button class="btn" id="parse-btn" style="flex:1;">Parse and fill fields below</button>
      <span id="parse-status" class="hint"></span>
    </div>

    <div class="section-label">Item</div>
    <div class="field-row">
      <div class="field"><label>Maker</label><input id="f-maker" list="maker-options"><datalist id="maker-options"></datalist></div>
      <div class="field"><label>Model</label><input id="f-model"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Variation</label><input id="f-variation"></div>
      <div class="field"><label>Designer <span class="hint">(if different from the maker/brand)</span></label>
        <input id="f-designer" list="designer-options"><datalist id="designer-options"></datalist>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Category</label>
        <select id="f-category"><option>Knife</option><option>Accessory</option><option>Custom</option></select>
      </div>
      <div class="field"><label>Type</label><input id="f-type" placeholder="Folder, Fixed, OTF Automatic"></div>
      <div class="field"><label>Lock</label><input id="f-lock"></div>
    </div>

    <div class="section-label">Specs</div>
    <div class="field-row">
      <div class="field"><label>Steel</label><input id="f-steel"></div>
      <div class="field"><label>Blade length</label><input id="f-bladeLength"></div>
      <div class="field"><label>Overall length</label><input id="f-overallLength"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Handle material</label><input id="f-handleMat"></div>
      <div class="field"><label>Finish</label><input id="f-finish"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Notes</label><textarea id="f-notes" rows="3"></textarea></div>
    </div>

    <div class="section-label">Photos</div>
    <div class="field-row">
      <div class="field">
        <label>Primary photo</label>
        <input type="file" id="f-primary-upload" accept="image/*">
        <img id="f-primary-preview" class="form-preview" hidden>
      </div>
      <div class="field">
        <label>Additional photos</label>
        <input type="file" id="f-extra-upload" accept="image/*" multiple>
        <div id="f-extra-preview" class="extra-preview"></div>
      </div>
    </div>

    <div class="section-label">Status and priority</div>
    <div class="field-row">
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          <option>Target</option><option>Collection</option><option>Comps</option>
          <option>Gift</option><option>Sell</option><option>Sold</option>
          <option>Pending</option><option>Passed</option><option>Returned</option>
        </select>
      </div>
      <div class="field">
        <label>Condition</label>
        <select id="f-condition"><option value="">—</option><option value="new">New</option><option value="preowned">Preowned</option><option value="either">Either</option></select>
      </div>
      <div class="field">
        <label>Priority</label>
        <div class="priority-picker" id="priority-picker"></div>
      </div>
    </div>
    <div class="field-row" id="status-note-row">
      <div class="field"><label>Note for this status change <span class="hint">(optional — saved with the timestamp, only if status is changing)</span></label>
        <input id="f-status-note" placeholder="e.g. buyer paid shipping, consignment fee $50">
      </div>
    </div>
    <div class="field-row" id="comps-row" hidden>
      <div class="field">
        <label>Comparable for <span class="hint">(pick the item(s) in your collection this comp is pricing)</span></label>
        <div id="comp-selected" class="comp-selected"></div>
        <input type="search" id="comp-search" placeholder="Search your collection by maker, model, order #…">
        <div class="comp-list" id="comp-list"></div>
      </div>
    </div>
    <div class="field-row" id="passed-row" hidden>
      <div class="field"><label>Reason passed</label><input id="f-reason"></div>
    </div>
    <div class="field-row" id="sold-row" hidden>
      <div class="field"><label>Sale date</label><input id="f-saleDate" type="date"></div>
      <div class="field">
        <label>Method of sale</label>
        <select id="f-saleMethod-select">
          <option value="">—</option>
          <option>Blade Binge</option>
          <option>BladeForums Exchange</option>
          <option>KnifeTrader</option>
          <option>Direct to individual</option>
          <option>eBay</option>
          <option>Facebook group</option>
          <option>Instagram</option>
          <option>Consignment (dealer)</option>
          <option>Trade-in (vendor)</option>
          <option>Local show / meet</option>
          <option value="__other">Other…</option>
        </select>
      </div>
      <div class="field" id="sold-method-custom-wrap" hidden>
        <label>Custom method</label><input id="f-saleMethod-custom" placeholder="Type the venue or method">
      </div>
    </div>
    <div class="field-row" id="sold-price-row" hidden>
      <div class="field"><label>Sale price</label><input id="f-salePrice" placeholder="850.00"></div>
    </div>

    <div class="section-label">Pricing and purchase</div>
    <div class="field-row">
      <div class="field"><label>Target price</label><input id="f-targetPrice" placeholder="$950"></div>
      <div class="field"><label>Price paid</label><input id="f-pricePaid" placeholder="950.00"></div>
      <div class="field"><label>Qty</label><input id="f-qty" type="number" min="1" value="1"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Vendor</label><input id="f-vendor" list="vendor-options"><datalist id="vendor-options"></datalist></div>
      <div class="field"><label>Order #</label><input id="f-orderNum"></div>
      <div class="field"><label>Purchase date</label><input id="f-purchaseDate" type="date"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Product link</label><input id="f-productLink"></div>
    </div>

    <div class="section-label">Mechanical</div>
    <div class="field-row">
      <div class="field"><label>Action — deploy (1–5)</label>
        <select id="f-actionDeploy"><option value=""></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </div>
      <div class="field"><label>Action — closing (1–5)</label>
        <select id="f-actionClosing"><option value=""></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </div>
      <div class="field"><label>Carry</label><input id="f-carry"></div>
    </div>
    <div class="field-row">
      <label class="check"><input type="checkbox" id="f-returned"> Returned</label>
    </div>

    <div class="section-label">Customizations <span class="hint">(work done to this knife — add one entry per job)</span></div>
    <div id="customization-list" class="cz-list"></div>
    <div class="field-row cz-add">
      <div class="field"><label>Date</label><input id="f-cz-date" type="date"></div>
      <div class="field"><label>What was done</label>
        <input id="f-cz-note" placeholder="e.g. regrind to full flat by Josh at JD Custom; anodized bronze">
      </div>
      <button type="button" class="btn" id="cz-add-btn">Add customization</button>
    </div>

    <div class="form-actions">
      <button class="btn btn-cancel" id="cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="save-btn">Save item</button>
    </div>
  </div>

  <div id="result-count" class="result-count"></div>
  <div id="cards"></div>
  <div id="table-wrap" hidden>
    <table id="tbl">
      <thead><tr>
        <th data-sk="purchaseDate">Date</th><th data-sk="maker">Maker</th><th>Item</th>
        <th>Photo</th><th data-sk="vendor">Vendor</th><th data-sk="status">Status</th>
        <th data-sk="category">Type</th><th data-sk="price">Price</th><th></th>
      </tr></thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>
</main>

<div class="lightbox" id="lightbox" hidden><img id="lightbox-img" alt=""><button id="lightbox-close">×</button></div>

<div class="modal-overlay" id="io-modal" hidden>
  <div class="modal-box">
    <div class="modal-hdr"><h2 id="io-title">Back up</h2><button class="modal-close" id="io-close">×</button></div>
    <div class="modal-body">
      <p class="hint" id="io-hint"></p>
      <label class="check" id="io-photo-label"><input type="checkbox" id="io-with-photos"> Include photos (much larger file)</label>
      <textarea id="io-text" rows="12" spellcheck="false"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" id="io-cancel">Close</button>
      <button class="btn" id="io-copy">Copy</button>
      <button class="btn" id="io-download">Download file</button>
      <button class="btn btn-primary" id="io-apply" hidden>Restore this data</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
