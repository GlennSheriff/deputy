    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB blocked'));
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
}
function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
function pReq(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function idbPutAll(store, rows, keyFn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, 'readwrite'), os = t.objectStore(store);
    rows.forEach(r => keyFn ? os.put(r.value, keyFn(r)) : os.put(r));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

async function saveRecords() {
  if (storageMode === 'idb') {
    try {
      await new Promise((res, rej) => {
        const t = db.transaction('records', 'readwrite'), os = t.objectStore('records');
        os.clear();
        items.forEach(i => os.put(i));
        t.oncomplete = () => res(); t.onerror = () => rej(t.error);
      });
      return true;
    } catch (e) { console.error(e); setStorageState('error', e.message); return false; }
  }
  if (storageMode === 'local') {
    try { localStorage.setItem('bladelog-records', JSON.stringify(items)); return true; }
    catch (e) { setStorageState('error', 'localStorage full'); return false; }
  }
  return false;
}

async function savePhotos(id, arr) {
  photoCache[id] = arr;
  if (storageMode === 'idb') {
    try { await pReq(tx('photos', 'readwrite').put(arr, id)); return true; }
    catch (e) { setStorageState('error', e.message); return false; }
  }
  return false;
}

async function getPhotos(id) {
  if (photoCache[id]) return photoCache[id];
  if (storageMode === 'idb') {
    try {
      const v = await pReq(tx('photos', 'readonly').get(id));
      if (v) { photoCache[id] = v; return v; }
    } catch (e) { /* fall through */ }
  }
  return null;
}

/* Migrate any record saved under the older schema, where Customize was a
   status value and `customized` a boolean. Runs on load so an existing
   browser database from a previous version upgrades itself cleanly. */
function migrateCustomizations(rows) {
  let changed = 0;
  rows.forEach(r => {
    if (!Array.isArray(r.customizations)) r.customizations = [];
    if (r.customized === true && !r.customizations.length) {
      r.customizations.push({ date: r.purchaseDate || r.dateAdded || '', note: 'Customized (imported from previous version)' });
      changed++;
    }
    if ('customized' in r) delete r.customized;
    if (r.status === 'Customize') {
      r.status = 'Collection';
      if (!r.customizations.length) {
        r.customizations.push({ date: r.dateAdded || '', note: 'Customized (was Customize status)' });
      }
      (r.statusHistory = r.statusHistory || []).push({
        value: 'Collection', date: new Date().toISOString().slice(0, 10),
        note: 'Auto-migrated: Customize is now a separate field, not a status.'
      });
      changed++;
    }
  });
  return changed;
}

function setStorageState(mode, detail) {
  const el = document.getElementById('storage-state');
  const map = {
    idb: ['ok', 'Saved on this device'],
    local: ['warn', 'Saving to browser storage (limited)'],
    memory: ['bad', 'Not saving — back up before closing'],
    error: ['bad', 'Save failed'],
    loading: ['warn', detail || 'working…']
  };
  const [cls, text] = map[mode] || map.memory;
  el.className = 'storage-state ' + cls;
  el.textContent = detail && mode === 'loading' ? detail : text;
  el.title = detail || text;
}

/* ------------------------------------------------------------ first run */
async function bootstrap() {
  setStorageState('loading', 'opening storage…');
  try {
    db = await openDB();
    storageMode = 'idb';
    if (navigator.storage && navigator.storage.persist) {
      try { await navigator.storage.persist(); } catch (e) { }
    }
  } catch (e) {
    try {
      localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
      storageMode = 'local';
    } catch (e2) { storageMode = 'memory'; }
  }

  let loaded = null;
  if (storageMode === 'idb') {
    const ver = await pReq(tx('meta', 'readonly').get('seedVersion')).catch(() => null);
    const rows = await pReq(tx('records', 'readonly').getAll()).catch(() => null);
    if (rows && rows.length && ver === SEED_VERSION) loaded = rows;
  } else if (storageMode === 'local') {
    try {
      const raw = localStorage.getItem('bladelog-records');
      const ver = localStorage.getItem('bladelog-seedVersion');
      if (raw && ver === SEED_VERSION) loaded = JSON.parse(raw);
    } catch (e) { }
  }

  if (loaded) {
    items = loaded;
    const migrated = migrateCustomizations(items);
    setStorageState(storageMode);
    render();
    if (migrated) { saveRecords(); toast(`Updated ${migrated} record${migrated === 1 ? '' : 's'} to the new customization field.`); }
    hydratePhotosIfMissing();
  } else {
    items = SEED_RECORDS.map(r => Object.assign({}, r));
    migrateCustomizations(items);
    setStorageState('loading', 'first run — setting up…');
    render();
    await saveRecords();
    if (storageMode === 'idb') await pReq(tx('meta', 'readwrite').put(SEED_VERSION, 'seedVersion')).catch(() => { });
    else if (storageMode === 'local') { try { localStorage.setItem('bladelog-seedVersion', SEED_VERSION); } catch (e) { } }
    await loadSeedPhotos();
    setStorageState(storageMode);
  }
  buildFilterLists();
}

async function hydratePhotosIfMissing() {
  if (storageMode !== 'idb') return;
  const n = await pReq(tx('photos', 'readonly').count()).catch(() => 0);
  if (!n) await loadSeedPhotos();
}

async function loadSeedPhotos() {
  if (storageMode !== 'idb') {
    setStorageState(storageMode);
    return;   // photo bundle is too large for localStorage; skip cleanly
  }
  try {
    setStorageState('loading', 'downloading photos…');
    const res = await fetch('photos.json', { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const entries = Object.entries(data);
    let done = 0;
    for (const [id, arr] of entries) {
      await pReq(tx('photos', 'readwrite').put(arr, id));
      done++;
      if (done % 10 === 0) setStorageState('loading', `photos ${done}/${entries.length}…`);
    }
    setStorageState(storageMode);
    render();
  } catch (e) {
    console.warn('photos.json not loaded:', e.message);
    setStorageState(storageMode);
    toast('Photos not loaded (' + e.message + '). The app works without them.');
  }
}

/* ------------------------------------------------------------- utilities */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function money(v) {
  if (v === '' || v == null) return '';
  const n = Number(String(v).replace(/[^0-9.\-]/g, ''));
  if (!isFinite(n) || n === 0) return String(v).startsWith('$') ? v : '';
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function numeric(v) { const n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; }
function uid() { return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 4200);
}
function displayPrice(it) {
  if (it.status === 'Sold') return money(it.salePrice) || money(it.pricePaid);
  return OWNED.includes(it.status) ? money(it.pricePaid) || money(it.targetPrice)
                                   : money(it.targetPrice) || money(it.pricePaid);
}

/* ------------------------------------------------------------ comparables */
/* A Comps record's own compFor[] lists the collection items it prices.
   Kept separate from relatedIds, which is the merge-derived "same model"
   link — that one was inferred, this one is your explicit choice. */
function compValue(it) {
  return numeric(it.salePrice) || numeric(it.targetPrice) || numeric(it.pricePaid);
}
function compsFor(id) {
  return items.filter(i => i.status === 'Comps' && Array.isArray(i.compFor) && i.compFor.includes(id));
}
function compStats(id) {
  const list = compsFor(id);
  const vals = list.map(compValue).filter(v => v > 0);
  if (!vals.length) return { count: list.length, avg: 0, low: 0, high: 0 };
  const sum = vals.reduce((a, b) => a + b, 0);
  return {
    count: list.length, avg: sum / vals.length,
    low: Math.min(...vals), high: Math.max(...vals)
  };
}
function compLabel(it) {
  return [it.maker, it.model, it.variation].filter(Boolean).join(' — ').slice(0, 90);
}

/* --------------------------------------------------------- customizations */
/* An item can be customized more than once, at different times, regardless of
   its current status — so this is a log on the record, not a status value. */
function hasCustomizations(it) {
  return Array.isArray(it.customizations) && it.customizations.length > 0;
}
function sortedCustomizations(it) {
  return (it.customizations || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function customizedBadge(it) {
  if (!hasCustomizations(it)) return '';
  const n = it.customizations.length;
  const last = sortedCustomizations(it).slice(-1)[0];
  const tip = it.customizations.map(c => `${c.date || 'undated'}: ${c.note}`).join('\n');
  return `<span class="cz-badge" title="${esc(tip)}">✦ customized${n > 1 ? ' ×' + n : ''}${last && last.date ? ' · ' + esc(last.date) : ''}</span>`;
}

/* --------------------------------------------------------------- filters */
function matches(it) {
  if (state.status !== 'all' && it.status !== state.status) return false;
  if (state.cat !== 'all' && it.category !== state.cat) return false;
  if (state.makers.size) {
    const direct = state.makers.has(it.maker);
    const viaAlias = [...state.makers].some(p => (MAKER_ALIASES[p] || []).includes(it.maker));
    if (!direct && !viaAlias) return false;
  }
  if (state.vendors.size && !state.vendors.has(it.vendor)) return false;
  if (state.designers.size && !state.designers.has(it.designer)) return false;
  if (state.flagsOnly && !(it.flags && it.flags.length)) return false;
  if (state.customizedOnly && !hasCustomizations(it)) return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    const hay = [it.maker, it.model, it.variation, it.itemOriginal, it.steel, it.vendor,
                 it.orderNum, it.notes, it.handleMat, it.finish, it.status, it.designer,
                 (it.customizations || []).map(c => c.note).join(' ')]
      .join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sorted(list) {
  const [key, dir] = state.sort.split('-');
  const s = dir === 'asc' ? 1 : -1;
  return list.slice().sort((a, b) => {
    let av, bv;
    if (key === 'price') { av = numeric(displayPrice(a)); bv = numeric(displayPrice(b)); }
    else if (key === 'priority') { av = a.priority || 0; bv = b.priority || 0; }
    else { av = (a[key] || '').toString().toLowerCase(); bv = (b[key] || '').toString().toLowerCase(); }
    if (av < bv) return -1 * s;
    if (av > bv) return 1 * s;
    return 0;
  });
}

/* ----------------------------------------------------------------- render */
function statusBadge(s) {
  const cls = { Target: 'st-target', Collection: 'st-owned', Comps: 'st-comps', Sell: 'st-sell',
                Sold: 'st-sold', Passed: 'st-passed', Returned: 'st-returned',
                Gift: 'st-gift', Pending: 'st-pending' }[s] || '';
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}
function bladeIcon(filled) {
  return `<svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
    <path d="M3 20 L14 4 L18 8 L7 21 Z" fill="${filled ? 'var(--accent)' : 'none'}"
      stroke="${filled ? 'var(--accent)' : 'var(--text-faint)'}" stroke-width="1.5"/></svg>`;
}
function priorityMini(p) {
  if (!p) return '';
  let h = '<span class="priority-mini" title="Priority ' + p + ' of 5">';
  for (let i = 1; i <= 5; i++) h += bladeIcon(i <= p);
  return h + '</span>';
}
function flagBadges(it) {
  if (!it.flags || !it.flags.length) return '';
  const label = {
    'owns-this-model': 'you own this model',
    'targeted-variant': 'targeted variant exists',
    'maker-review': 'maker name needs review'
  };
  return it.flags.map(f => `<span class="flag" title="Flagged during the merge">⚑ ${esc(label[f] || f)}</span>`).join('');
}

function compSummaryChip(it) {
  if (!OWNED.includes(it.status)) return '';
  const s = compStats(it.id);
  if (!s.count) return '';
  const price = s.avg ? ` · avg ${money(s.avg)}` : '';
  const range = (s.avg && s.low !== s.high) ? ` (${money(s.low)}–${money(s.high)})` : '';
  return `<span class="comp-badge" title="Comparable sales you've linked to this item">◈ ${s.count} comp${s.count === 1 ? '' : 's'}${price}${range}</span>`;
}
function compForChip(it) {
  if (it.status !== 'Comps' || !Array.isArray(it.compFor) || !it.compFor.length) return '';
  const names = it.compFor.map(id => {
    const t = items.find(x => x.id === id);
    return t ? (t.model || t.itemOriginal).slice(0, 34) : null;
  }).filter(Boolean);
  if (!names.length) return '';
  return `<span class="comp-badge" title="This comp is priced against these items you own">◈ comp for ${esc(names.join(', '))}</span>`;
}

function render() {
  const list = sorted(items.filter(matches));
  document.getElementById('result-count').textContent =
    `${list.length} of ${items.length} items`;
  updateStats();
  if (state.view === 'cards') {
    document.getElementById('cards').hidden = false;
    document.getElementById('table-wrap').hidden = true;
    renderCards(list);
  } else {
    document.getElementById('cards').hidden = true;
    document.getElementById('table-wrap').hidden = false;
    renderTable(list);
  }
}

function renderCards(list) {
  const wrap = document.getElementById('cards');
  if (!list.length) { wrap.innerHTML = '<div class="empty">Nothing matches these filters.</div>'; return; }
  wrap.innerHTML = list.map(it => `
    <div class="card" data-id="${it.id}">
      <div class="card-top">
        <div class="card-thumb" data-thumb="${it.id}">${it.hasPhotos ? '<div class="thumb-ph"></div>' : '<div class="thumb-none">no photo</div>'}</div>
        <div class="card-title">
          <div class="card-model">${esc(it.model || it.itemOriginal)}</div>
          ${it.variation ? `<div class="card-variation">${esc(it.variation)}</div>` : ''}
          <div class="card-meta">
            <span class="maker">${esc(it.maker)}</span>
            ${it.designer ? `<span class="designer" title="Designer">✎ ${esc(it.designer)}</span>` : ''}
            ${statusBadge(it.status)}
            ${it.condition ? `<span class="badge ${it.condition === 'new' ? 'new' : 'pre'}">${it.condition === 'preowned' ? 'Preowned' : it.condition === 'new' ? 'New' : 'Either'}</span>` : ''}
            ${priorityMini(it.priority)}
          </div>
          <div class="card-meta small">
            ${it.steel ? `<span>${esc(it.steel)}</span>` : ''}
            ${it.bladeLength ? `<span>${esc(it.bladeLength)}</span>` : ''}
            ${it.handleMat ? `<span>${esc(it.handleMat)}</span>` : ''}
          </div>
          ${flagBadges(it)}
          ${customizedBadge(it)}${compSummaryChip(it)}${compForChip(it)}
        </div>
        <div class="card-price">
          ${displayPrice(it) ? `<div class="price">${esc(displayPrice(it))}</div>` : ''}
          ${it.vendor ? `<div class="vendor">${esc(it.vendor)}</div>` : ''}
          ${it.orderNum ? `<div class="vendor">${esc(it.orderNum)}</div>` : ''}
        </div>
      </div>
      ${it.notes ? `<div class="card-notes">${esc(it.notes)}</div>` : ''}
      <div class="card-extra" data-extra="${it.id}"></div>
      <div class="card-actions">
        ${it.productLink ? `<a class="lnk" href="${esc(it.productLink)}" target="_blank" rel="noopener">Product page</a>` : ''}
        <button data-act="detail" data-id="${it.id}">Details</button>
        <button data-act="edit" data-id="${it.id}">Edit</button>
        <button data-act="del" data-id="${it.id}">Remove</button>
      </div>
      <div class="card-detail" data-detail="${it.id}" hidden></div>
    </div>`).join('');
  list.forEach(it => { if (it.hasPhotos) paintThumb(it.id); });
}

async function paintThumb(id) {
  const arr = await getPhotos(id);
  const el = document.querySelector(`[data-thumb="${id}"]`);
  if (!el) return;
  if (!arr || !arr.length) { el.innerHTML = '<div class="thumb-none">no photo</div>'; return; }
  el.innerHTML = `<img src="${esc(arr[0])}" loading="lazy" alt="" data-full="${esc(arr[0])}">`;
  const extra = document.querySelector(`[data-extra="${id}"]`);
  if (extra && arr.length > 1) {
    extra.innerHTML = arr.slice(1, 6).map(p =>
      `<img class="card-extra-thumb" src="${esc(p)}" loading="lazy" alt="" data-full="${esc(p)}">`).join('');
  }
}

function renderTable(list) {
  document.getElementById('tbl-body').innerHTML = list.map(it => `
    <tr data-id="${it.id}">
      <td class="mono">${esc(it.purchaseDate || it.dateAdded || '')}</td>
      <td>${esc(it.maker)}</td>
      <td><div class="t-model">${esc(it.model || it.itemOriginal)}</div>
          ${it.variation ? `<div class="t-var">${esc(it.variation)}</div>` : ''}</td>
      <td class="t-photo" data-thumb="${it.id}">${it.hasPhotos ? '' : '—'}</td>
      <td>${esc(it.vendor)}</td>
      <td>${statusBadge(it.status)}</td>
      <td>${esc(it.category)}</td>
      <td class="mono">${esc(displayPrice(it))}</td>
      <td><button data-act="edit" data-id="${it.id}">Edit</button></td>
    </tr>`).join('');
  list.forEach(it => { if (it.hasPhotos) paintThumb(it.id); });
}

function updateStats() {
  const knives = items.filter(i => i.category === 'Knife');
  const owned = items.filter(i => OWNED.includes(i.status) && i.status !== 'Returned');
  const spend = owned.reduce((s, i) => s + numeric(i.pricePaid) * (Number(i.qty) || 1), 0);
  const targets = items.filter(i => i.status === 'Target');
  const tval = targets.reduce((s, i) => s + numeric(i.targetPrice), 0);
  const sold = items.filter(i => i.status === 'Sold');
  const soldRevenue = sold.reduce((s, i) => s + numeric(i.salePrice || i.pricePaid), 0);
  document.getElementById('stats-line').innerHTML =
    `<b>${items.length}</b> items · <b>${knives.length}</b> knives · ` +
    `<b>${owned.length}</b> owned · spend <b>${money(spend)}</b> · ` +
    `<b>${targets.length}</b> targets worth <b>${money(tval)}</b>` +
    (sold.length ? ` · <b>${sold.length}</b> sold for <b>${money(soldRevenue)}</b>` : '');
}

/* -------------------------------------------------------------- detail */
function detailHtml(it) {
  const rows = [
    ['Full original entry', it.itemOriginal],
    ['Designer', it.designer],
    ['Steel', it.steel], ['Blade length', it.bladeLength], ['Overall length', it.overallLength],
    ['Handle', it.handleMat], ['Finish', it.finish], ['Lock', it.lock], ['Type', it.type],
    ['Carry', it.carry], ['Condition', it.condition], ['Vendor', it.vendor],
    ['Order #', it.orderNum], ['Qty', it.qty], ['Target price', money(it.targetPrice)],
    ['Price paid', money(it.pricePaid)], ['Purchase date', it.purchaseDate],
    ['Sale date', it.saleDate], ['Method of sale', it.saleMethod], ['Sale price', money(it.salePrice)],
    ['Added', it.dateAdded], ['Action — deploy', it.actionDeploy], ['Action — closing', it.actionClosing],
    ['Reason', it.reason],
    ['Description', it.description], ['Source', it.source === 'target' ? 'target list' : 'collection'],
    ['Model split', it.splitConfidence]
  ].filter(r => r[1] !== '' && r[1] != null && r[1] !== 0);
  let h = '<dl class="detail-grid">' +
    rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('') + '</dl>';
  if (it.statusHistory && it.statusHistory.length) {
    h += '<div class="status-history"><b>Status history</b><ul>' +
      it.statusHistory.map(h2 => `<li><span class="sh-date">${esc(h2.date || '')}</span> — ${esc(h2.value)}` +
        (h2.note ? `<span class="sh-note">${esc(h2.note)}</span>` : '') + '</li>').join('') + '</ul></div>';
  }
  if (hasCustomizations(it)) {
    h += '<div class="cz-block"><b>Customizations</b><ul>' +
      sortedCustomizations(it).map(c =>
        `<li><span class="sh-date">${esc(c.date || 'undated')}</span> — ${esc(c.note)}</li>`
      ).join('') + '</ul></div>';
  }
  if (OWNED.includes(it.status)) {
    const linked = compsFor(it.id);
    if (linked.length) {
      const s = compStats(it.id);
      h += `<div class="comp-block"><b>Comparable sales</b>` +
        (s.avg ? `<div class="comp-stats">avg ${money(s.avg)}` +
          (s.low !== s.high ? ` · range ${money(s.low)}–${money(s.high)}` : '') +
          (it.pricePaid && s.avg ? ` · you paid ${money(it.pricePaid)}` : '') + `</div>` : '') +
        '<ul>' + linked.map(c => `<li><a href="#" data-goto="${esc(c.id)}">${esc(compLabel(c))}</a>` +
          (compValue(c) ? ` — <b>${esc(money(compValue(c)))}</b>` : '') +
          (c.saleDate ? ` <span class="sh-date">${esc(c.saleDate)}</span>` : '') +
          (c.saleMethod ? ` <em>${esc(c.saleMethod)}</em>` : '') + '</li>').join('') +
        '</ul></div>';
    }
  }
  if (it.status === 'Comps' && Array.isArray(it.compFor) && it.compFor.length) {
    h += '<div class="comp-block"><b>Comparable for</b><ul>' + it.compFor.map(id => {
      const t = items.find(x => x.id === id);
      return t ? `<li><a href="#" data-goto="${esc(id)}">${esc(compLabel(t))}</a>` +
        (t.pricePaid ? ` — paid ${esc(money(t.pricePaid))}` : '') + '</li>' : '';
    }).join('') + '</ul></div>';
  }
  if (it.relatedIds && it.relatedIds.length) {
    h += '<div class="related"><b>Related records</b><ul>' + it.relatedIds.map(rid => {
      const r = items.find(x => x.id === rid);
      return r ? `<li><a href="#" data-goto="${rid}">${esc(r.maker)} — ${esc(r.model)} ${esc(r.variation || '')} <em>(${esc(r.status)})</em></a></li>` : '';
    }).join('') + '</ul></div>';
  }
  return h;
}

/* ---------------------------------------------------------------- form */
function openForm(id) {
  editingId = id || null;
  const it = id ? items.find(x => x.id === id) : null;
  const g = k => document.getElementById('f-' + k);
  ['maker', 'model', 'variation', 'designer', 'steel', 'bladeLength', 'overallLength', 'handleMat', 'finish',
   'notes', 'vendor', 'orderNum', 'productLink', 'purchaseDate', 'targetPrice', 'pricePaid',
   'lock', 'type', 'carry', 'reason', 'actionDeploy', 'actionClosing', 'saleDate', 'salePrice'].forEach(k => {
    if (g(k)) g(k).value = it ? (it[k] == null ? '' : it[k]) : '';
  });
  g('category').value = it ? it.category : 'Knife';
  g('status').value = it ? it.status : 'Target';
  g('condition').value = it ? (it.condition || '') : '';
  g('qty').value = it ? (it.qty || 1) : 1;
  g('returned').checked = it ? !!it.returned : false;
  formCustomizations = it && Array.isArray(it.customizations)
    ? it.customizations.map(c => ({ date: c.date || '', note: c.note || '' })) : [];
  renderCustomizations();
  document.getElementById('f-cz-date').value = '';
  document.getElementById('f-cz-note').value = '';
  g('status-note').value = '';
  const method = it ? (it.saleMethod || '') : '';
  const sel = document.getElementById('f-saleMethod-select');
  if (method && SALE_METHOD_PRESETS.includes(method)) {
    sel.value = method;
    document.getElementById('sold-method-custom-wrap').hidden = true;
  } else if (method) {
    sel.value = '__other';
    document.getElementById('f-saleMethod-custom').value = method;
    document.getElementById('sold-method-custom-wrap').hidden = false;
  } else {
    sel.value = '';
    document.getElementById('f-saleMethod-custom').value = '';
    document.getElementById('sold-method-custom-wrap').hidden = true;
  }
  if (!it && !g('saleDate').value) g('saleDate').value = new Date().toISOString().slice(0, 10);
  formCompFor = new Set(it && Array.isArray(it.compFor) ? it.compFor : []);
  document.getElementById('comp-search').value = '';
  renderCompSelected();
  renderCompList('');
  formPriority = it ? (it.priority || 0) : 0;
  renderPriority();
  formPhotos = { primary: null, extra: [] };
  g('primary-preview').hidden = true;
  document.getElementById('f-extra-preview').innerHTML = '';
  if (it && it.hasPhotos) {
    getPhotos(it.id).then(arr => {
      if (!arr || !arr.length) return;
      formPhotos.primary = arr[0];
      formPhotos.extra = arr.slice(1);
      const p = g('primary-preview'); p.src = arr[0]; p.hidden = false;
      renderExtraPreview();
    });
  }
  syncStatusRows();
  document.getElementById('form-panel').hidden = false;
  document.getElementById('form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function closeForm() {
  document.getElementById('form-panel').hidden = true;
  editingId = null;
  document.getElementById('f-quickfill').value = '';
  document.getElementById('parse-status').textContent = '';
}
function renderPriority() {
  document.getElementById('priority-picker').innerHTML =
    [1, 2, 3, 4, 5].map(i => `<button type="button" class="pri" data-p="${i}">${bladeIcon(i <= formPriority)}</button>`).join('') +
    `<button type="button" class="pri-clear" data-p="0">clear</button>`;
}
function renderCustomizations() {
  const el = document.getElementById('customization-list');
  if (!formCustomizations.length) {
    el.innerHTML = '<div class="hint">No customizations recorded. Add one below if this knife has had work done.</div>';
    return;
  }
  el.innerHTML = formCustomizations
    .map((c, i) => ({ c, i }))
    .sort((a, b) => (a.c.date || '').localeCompare(b.c.date || ''))
    .map(({ c, i }) => `<div class="cz-row">
      <span class="cz-date">${esc(c.date || 'undated')}</span>
      <span class="cz-note">${esc(c.note)}</span>
      <button type="button" data-rmcz="${i}" title="Remove this customization">×</button>
    </div>`).join('');
}

function addCustomization() {
  const dEl = document.getElementById('f-cz-date');
  const nEl = document.getElementById('f-cz-note');
  const note = nEl.value.trim();
  if (!note) { toast('Describe what was done before adding it.'); nEl.focus(); return; }
  formCustomizations.push({ date: dEl.value || '', note });
  dEl.value = ''; nEl.value = '';
  renderCustomizations();
}

function syncStatusRows() {
  const s = document.getElementById('f-status').value;
  document.getElementById('passed-row').hidden = s !== 'Passed';
  document.getElementById('sold-row').hidden = s !== 'Sold';
  document.getElementById('sold-price-row').hidden = s !== 'Sold';
  document.getElementById('comps-row').hidden = s !== 'Comps';
}

function renderCompSelected() {
  const wrap = document.getElementById('comp-selected');
  if (!formCompFor.size) {
    wrap.innerHTML = '<span class="hint">Nothing linked yet — search below and tick the items this comp prices.</span>';
    return;
  }
  wrap.innerHTML = [...formCompFor].map(id => {
    const it = items.find(x => x.id === id);
    if (!it) return '';
    return `<span class="comp-chip">${esc(compLabel(it))}
      <button type="button" data-uncomp="${esc(id)}" title="Unlink">×</button></span>`;
  }).join('');
}

function renderCompList(query) {
  const q = (query || '').trim().toLowerCase();
  const pool = items.filter(i => OWNED.includes(i.status) && i.id !== editingId);
  let list;
  if (!q) {
    list = pool.slice(0, 0);
  } else {
    list = pool.filter(i => [i.maker, i.model, i.variation, i.itemOriginal, i.orderNum, i.steel]
      .join(' ').toLowerCase().includes(q)).slice(0, 40);
  }
  const el = document.getElementById('comp-list');
  if (!q) {
    el.innerHTML = '<div class="hint" style="padding:6px 2px;">Type to search your collection.</div>';
    return;
  }
  if (!list.length) {
    el.innerHTML = '<div class="hint" style="padding:6px 2px;">No collection items match that.</div>';
    return;
  }
  el.innerHTML = list.map(i => `<label><input type="checkbox" data-comp="${esc(i.id)}"
      ${formCompFor.has(i.id) ? 'checked' : ''}>
    <span class="comp-opt"><b>${esc(i.maker)}</b> ${esc(i.model)}
      ${i.variation ? `<em>${esc(i.variation.slice(0, 50))}</em>` : ''}
      <span class="comp-opt-meta">${esc(i.status)}${i.pricePaid ? ' · paid ' + esc(money(i.pricePaid)) : ''}${i.orderNum ? ' · ' + esc(i.orderNum) : ''}</span>
    </span></label>`).join('');
}
function renderExtraPreview() {
  document.getElementById('f-extra-preview').innerHTML = formPhotos.extra.map((src, i) =>
    `<span class="ex"><img src="${esc(src)}"><button type="button" data-rmx="${i}">×</button></span>`).join('');
}

function resizeImageFile(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode that image'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const s = maxDim / Math.max(width, height);
          width = Math.round(width * s); height = Math.round(height * s);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveForm() {
  const g = k => document.getElementById('f-' + k).value.trim();
  if (!g('maker') && !g('model')) { toast('Add at least a maker or a model.'); return; }
  const now = new Date().toISOString().slice(0, 10);
  let it = editingId ? items.find(x => x.id === editingId) : null;
  const isNew = !it;
  if (isNew) {
    it = { id: uid(), source: 'manual', dateAdded: now, statusHistory: [], relatedIds: [], flags: [], splitConfidence: 'native' };
    items.push(it);
  }
  const prevStatus = it.status;
  const saleMethodSel = document.getElementById('f-saleMethod-select').value;
  const saleMethod = saleMethodSel === '__other' ? g('saleMethod-custom') : saleMethodSel;
  Object.assign(it, {
    maker: g('maker'), model: g('model'), variation: g('variation'), designer: g('designer'),
    category: g('category'), steel: g('steel'), bladeLength: g('bladeLength'),
    overallLength: g('overallLength'), handleMat: g('handleMat'), finish: g('finish'),
    lock: g('lock'), type: g('type'), carry: g('carry'), notes: g('notes'),
    vendor: g('vendor'), orderNum: g('orderNum'), productLink: g('productLink'),
    targetPrice: g('targetPrice'), pricePaid: g('pricePaid'), purchaseDate: g('purchaseDate'),
    qty: Number(g('qty')) || 1, status: g('status'), condition: g('condition'),
    priority: formPriority, reason: g('reason'),
    actionDeploy: g('actionDeploy'), actionClosing: g('actionClosing'),
    customizations: formCustomizations.filter(c => c.note),
    returned: document.getElementById('f-returned').checked,
    saleDate: g('status') === 'Sold' ? g('saleDate') : it.saleDate || '',
    saleMethod: g('status') === 'Sold' ? saleMethod : it.saleMethod || '',
    salePrice: g('status') === 'Sold' ? g('salePrice') : it.salePrice || '',
    compFor: g('status') === 'Comps' ? [...formCompFor] : (it.compFor || [])
  });
  it.itemOriginal = [it.model, it.variation].filter(Boolean).join(' ');
  if (!it.statusHistory) it.statusHistory = [];
  if (prevStatus !== it.status) {
    const entry = { value: it.status, date: now };
    const note = g('status-note');
    if (note) entry.note = note;
    it.statusHistory.push(entry);
  }

  const arr = [];
  if (formPhotos.primary) arr.push(formPhotos.primary);
  formPhotos.extra.forEach(p => { if (p !== formPhotos.primary) arr.push(p); });
  it.hasPhotos = arr.length > 0;
  if (arr.length) await savePhotos(it.id, arr); else { delete photoCache[it.id]; }

  const ok = await saveRecords();
  closeForm();
  buildFilterLists();
  render();
  toast(ok ? (isNew ? 'Item added.' : 'Changes saved.') : 'Saved for this session only — back up before closing.');
}

/* ------------------------------------------------------------ quick fill */
const FIELD_ALIASES = {
  maker: 'maker', brand: 'maker', model: 'model', variation: 'variation', variant: 'variation',
  designer: 'designer', design: 'designer', designed: 'designer', 'designed by': 'designer',
  steel: 'steel', 'blade steel': 'steel', handle: 'handleMat', 'handle material': 'handleMat',
  finish: 'finish', 'blade length': 'bladeLength', blade: 'bladeLength',
  'overall length': 'overallLength', overall: 'overallLength', lock: 'lock', 'lock type': 'lock',
  type: 'type', notes: 'notes', note: 'notes', price: 'targetPrice', 'target price': 'targetPrice',
  msrp: 'targetPrice', vendor: 'vendor', dealer: 'vendor', link: 'productLink', url: 'productLink',
  condition: 'condition', status: 'status', 'order #': 'orderNum', 'order number': 'orderNum',
  order: 'orderNum', 'purchase date': 'purchaseDate', date: 'purchaseDate',
  'price paid': 'pricePaid', paid: 'pricePaid', qty: 'qty', quantity: 'qty',
  category: 'category', carry: 'carry', 'action deploy': 'actionDeploy', deploy: 'actionDeploy',
  'action closing': 'actionClosing', closing: 'actionClosing', priority: 'priority',
  'sale date': 'saleDate', 'sold date': 'saleDate',
  'sale price': 'salePrice', 'sold price': 'salePrice', 'sold for': 'salePrice',
  'sale method': 'saleMethodQuick', 'method of sale': 'saleMethodQuick',
  'sold via': 'saleMethodQuick', platform: 'saleMethodQuick',
  'status note': 'status-note', 'sale note': 'status-note',
  customization: 'customizationQuick', customized: 'customizationQuick',
  'custom work': 'customizationQuick'
};
function quickFill() {
  const raw = document.getElementById('f-quickfill').value;
  const lines = raw.split('\n');
  let n = 0;
  lines.forEach(line => {
    const m = line.match(/^\s*([^:]{1,28}):\s*(.+?)\s*$/);
    if (!m) return;
    const key = FIELD_ALIASES[m[1].trim().toLowerCase()];
    if (!key) return;
    let val = m[2].trim();
    if (key === 'condition') {
      val = /pre/i.test(val) ? 'preowned' : /new/i.test(val) ? 'new' : /either/i.test(val) ? 'either' : '';
    }
    if (key === 'status') {
      const s = val.toLowerCase();
      val = s.startsWith('targ') ? 'Target' : s.startsWith('own') || s.startsWith('coll') ? 'Collection'
          : s.startsWith('comp') ? 'Comps' : s.startsWith('pass') ? 'Passed' : s.startsWith('sold') ? 'Sold'
          : s.startsWith('sell') ? 'Sell' : s.startsWith('gift') ? 'Gift' : s.startsWith('pend') ? 'Pending'
          : s.startsWith('ret') ? 'Returned' : '';
      if (!val) return;
      document.getElementById('f-status').value = val;
      syncStatusRows();
      n++; return;
    }
    if (key === 'saleMethodQuick') {
      const sel = document.getElementById('f-saleMethod-select');
      const match = SALE_METHOD_PRESETS.find(p => p.toLowerCase() === val.toLowerCase());
      if (match) { sel.value = match; document.getElementById('sold-method-custom-wrap').hidden = true; }
      else {
        sel.value = '__other';
        document.getElementById('sold-method-custom-wrap').hidden = false;
        document.getElementById('f-saleMethod-custom').value = val;
      }
      n++; return;
    }
    if (key === 'customizationQuick') {
      // Accepts "Customization: 2026-03-14 — regrind by JD Custom" or just the note.
      const m2 = val.match(/^(\d{4}-\d{2}-\d{2})\s*[—\-:]\s*(.+)$/);
      formCustomizations.push(m2 ? { date: m2[1], note: m2[2].trim() } : { date: '', note: val });
      renderCustomizations();
      n++; return;
    }
    if (key === 'priority') { formPriority = Math.max(0, Math.min(5, parseInt(val) || 0)); renderPriority(); n++; return; }
    const el = document.getElementById('f-' + key);
    if (el) { el.value = val; n++; }
  });
  syncStatusRows();
  document.getElementById('parse-status').textContent =
    n ? `Filled ${n} field${n === 1 ? '' : 's'}.` : 'No "Label: value" lines recognized.';
}

/* --------------------------------------------------------- filter lists */
function buildFilterLists() {
  const makers = [...new Set(items.map(i => i.maker).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const vendors = [...new Set(items.map(i => i.vendor).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const designers = [...new Set(items.map(i => i.designer).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  document.getElementById('maker-options').innerHTML = makers.map(m => `<option value="${esc(m)}">`).join('');
  document.getElementById('vendor-options').innerHTML = vendors.map(m => `<option value="${esc(m)}">`).join('');
  document.getElementById('designer-options').innerHTML = designers.map(m => `<option value="${esc(m)}">`).join('');
  paintMS('maker', makers, state.makers);
  paintMS('vendor', vendors, state.vendors);
  paintMS('designer', designers, state.designers);
}
function paintMS(kind, values, chosen, filterText) {
  const q = (filterText || '').toLowerCase();
  document.getElementById(kind + '-list').innerHTML = values
    .filter(v => !q || v.toLowerCase().includes(q))
    .map(v => `<label><input type="checkbox" data-ms="${kind}" value="${esc(v)}" ${chosen.has(v) ? 'checked' : ''}> ${esc(v)}</label>`)
    .join('');
  const c = document.getElementById(kind + '-count');
  c.textContent = chosen.size ? '(' + chosen.size + ')' : '';
}

/* ------------------------------------------------------- backup/restore */
async function doExport() {
  const withPhotos = document.getElementById('io-with-photos').checked;
  const payload = { app: 'bladelog', seedVersion: SEED_VERSION, exported: new Date().toISOString(), records: items };
  if (withPhotos) {
    const photos = {};
    for (const it of items) { if (it.hasPhotos) { const a = await getPhotos(it.id); if (a) photos[it.id] = a; } }
    payload.photos = photos;
  }
  const text = JSON.stringify(payload);
  document.getElementById('io-text').value = text;
  document.getElementById('io-hint').textContent =
    `${items.length} records${withPhotos ? ' with photos' : ''} · ${(text.length / 1048576).toFixed(2)} MB. Copy it, or download the file.`;
}
function openIO(mode) {
  const m = document.getElementById('io-modal');
  m.hidden = false;
  m.dataset.mode = mode;
  document.getElementById('io-title').textContent = mode === 'export' ? 'Back up' : 'Restore';
  document.getElementById('io-apply').hidden = mode === 'export';
  document.getElementById('io-copy').hidden = mode !== 'export';
  document.getElementById('io-download').hidden = mode !== 'export';
  document.getElementById('io-photo-label').hidden = mode !== 'export';
  if (mode === 'export') { doExport(); }
  else {
    document.getElementById('io-text').value = '';
    document.getElementById('io-hint').textContent = 'Paste a backup file\'s contents here, then restore. This replaces everything currently stored.';
  }
}
async function doImport() {
  let data;
  try { data = JSON.parse(document.getElementById('io-text').value); }
  catch (e) { toast('That is not valid backup data.'); return; }
  const recs = Array.isArray(data) ? data : data.records;
  if (!Array.isArray(recs) || !recs.length) { toast('No records found in that backup.'); return; }
  items = recs;
  if (data.photos && storageMode === 'idb') {
    for (const [id, arr] of Object.entries(data.photos)) await savePhotos(id, arr);
  }
  await saveRecords();
  buildFilterLists();
  render();
  document.getElementById('io-modal').hidden = true;
  toast(`Restored ${items.length} records.`);
}
function downloadBackup() {
  const text = document.getElementById('io-text').value;
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bladelog-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* --------------------------------------------------------------- events */
document.addEventListener('click', async (e) => {
  const t = e.target;

  const statusBtn = t.closest('#status-filters .filter-btn');
  if (statusBtn) {
    document.querySelectorAll('#status-filters .filter-btn').forEach(b => b.classList.remove('active'));
    statusBtn.classList.add('active');
    state.status = statusBtn.dataset.status; render(); return;
  }
  const catBtn = t.closest('#cat-filters .seg-opt');
  if (catBtn) {
    document.querySelectorAll('#cat-filters .seg-opt').forEach(b => b.classList.remove('active'));
    catBtn.classList.add('active'); state.cat = catBtn.dataset.cat; render(); return;
  }
  const viewBtn = t.closest('#view-toggle .seg-opt');
  if (viewBtn) {
    document.querySelectorAll('#view-toggle .seg-opt').forEach(b => b.classList.remove('active'));
    viewBtn.classList.add('active'); state.view = viewBtn.dataset.view; render(); return;
  }
  if (t.id === 'flag-btn') { state.flagsOnly = !state.flagsOnly; t.classList.toggle('active', state.flagsOnly); render(); return; }

  if (t.id === 'maker-btn') { const p = document.getElementById('maker-panel'); p.hidden = !p.hidden; return; }
  if (t.id === 'vendor-btn') { const p = document.getElementById('vendor-panel'); p.hidden = !p.hidden; return; }
  if (t.id === 'designer-btn') { const p = document.getElementById('designer-panel'); p.hidden = !p.hidden; return; }
  if (t.id === 'maker-clear') { state.makers.clear(); buildFilterLists(); render(); return; }
  if (t.id === 'vendor-clear') { state.vendors.clear(); buildFilterLists(); render(); return; }
  if (t.id === 'designer-clear') { state.designers.clear(); buildFilterLists(); render(); return; }
  if (t.dataset && t.dataset.ms) {
    const set = t.dataset.ms === 'maker' ? state.makers : t.dataset.ms === 'vendor' ? state.vendors : state.designers;
    t.checked ? set.add(t.value) : set.delete(t.value);
    document.getElementById(t.dataset.ms + '-count').textContent = set.size ? '(' + set.size + ')' : '';
    render(); return;
  }

  if (t.id === 'add-toggle') { openForm(null); return; }
  if (t.id === 'cancel-btn') { closeForm(); return; }
  if (t.id === 'save-btn') { saveForm(); return; }
  if (t.id === 'parse-btn') { quickFill(); return; }
  if (t.closest('.pri')) { formPriority = Number(t.closest('.pri').dataset.p); renderPriority(); return; }
  if (t.classList.contains('pri-clear')) { formPriority = 0; renderPriority(); return; }
  if (t.dataset && t.dataset.rmx != null) { formPhotos.extra.splice(Number(t.dataset.rmx), 1); renderExtraPreview(); return; }

  if (t.dataset && t.dataset.comp != null) {
    const id = t.dataset.comp;
    t.checked ? formCompFor.add(id) : formCompFor.delete(id);
    renderCompSelected();
    return;
  }
  if (t.dataset && t.dataset.uncomp) {
    formCompFor.delete(t.dataset.uncomp);
    renderCompSelected();
    renderCompList(document.getElementById('comp-search').value);
    return;
  }
  if (t.id === 'cz-add-btn') { addCustomization(); return; }
  if (t.dataset && t.dataset.rmcz != null) {
    formCustomizations.splice(Number(t.dataset.rmcz), 1);
    renderCustomizations();
    return;
  }
  if (t.id === 'cz-filter-btn') {
    state.customizedOnly = !state.customizedOnly;
    t.classList.toggle('active', state.customizedOnly);
    render(); return;
  }
  if (t.id === 'export-btn') { openIO('export'); return; }
  if (t.id === 'import-btn') { openIO('import'); return; }
  if (t.id === 'io-close' || t.id === 'io-cancel') { document.getElementById('io-modal').hidden = true; return; }
  if (t.id === 'io-apply') { doImport(); return; }
  if (t.id === 'io-download') { downloadBackup(); return; }
  if (t.id === 'io-copy') {
    const ta = document.getElementById('io-text'); ta.select();
    try { await navigator.clipboard.writeText(ta.value); toast('Backup copied to clipboard.'); }
    catch (e) { document.execCommand('copy'); toast('Backup copied.'); }
    return;
  }

  const act = t.dataset && t.dataset.act;
  if (act === 'edit') { openForm(t.dataset.id); return; }
  if (act === 'del') {
    const it = items.find(x => x.id === t.dataset.id);
    if (!it) return;
    if (!confirm(`Remove "${it.maker} ${it.model}"? This cannot be undone.`)) return;
    items = items.filter(x => x.id !== t.dataset.id);
    // Drop any comp links pointing at the removed record so they don't dangle.
    items.forEach(x => {
      if (Array.isArray(x.compFor) && x.compFor.includes(t.dataset.id)) {
        x.compFor = x.compFor.filter(cid => cid !== t.dataset.id);
      }
    });
    await saveRecords(); buildFilterLists(); render(); toast('Item removed.'); return;
  }
  if (act === 'detail') {
    const d = document.querySelector(`[data-detail="${t.dataset.id}"]`);
    const it = items.find(x => x.id === t.dataset.id);
    if (d.hidden) { d.innerHTML = detailHtml(it); d.hidden = false; t.textContent = 'Hide details'; }
    else { d.hidden = true; t.textContent = 'Details'; }
    return;
  }
  if (t.dataset && t.dataset.goto) {
    e.preventDefault();
    const card = document.querySelector(`.card[data-id="${t.dataset.goto}"]`);
    if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.classList.add('pulse'); setTimeout(() => card.classList.remove('pulse'), 1600); }
    else toast('That record is hidden by the current filters.');
    return;
  }
  if (t.dataset && t.dataset.full) {
    document.getElementById('lightbox-img').src = t.dataset.full;
    document.getElementById('lightbox').hidden = false; return;
  }
  if (t.id === 'lightbox-close' || t.id === 'lightbox') { document.getElementById('lightbox').hidden = true; return; }

  if (!t.closest('.ms-wrap')) {
    document.getElementById('maker-panel').hidden = true;
    document.getElementById('vendor-panel').hidden = true;
    document.getElementById('designer-panel').hidden = true;
  }
});

document.getElementById('search').addEventListener('input', e => { state.search = e.target.value.trim(); render(); });
document.getElementById('sort-by').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.getElementById('f-status').addEventListener('change', syncStatusRows);
document.getElementById('f-saleMethod-select').addEventListener('change', e => {
  document.getElementById('sold-method-custom-wrap').hidden = e.target.value !== '__other';
});
document.getElementById('comp-search').addEventListener('input', e => renderCompList(e.target.value));
document.getElementById('maker-search').addEventListener('input', e => {
  paintMS('maker', [...new Set(items.map(i => i.maker).filter(Boolean))].sort((a, b) => a.localeCompare(b)), state.makers, e.target.value);
});
document.getElementById('vendor-search').addEventListener('input', e => {
  paintMS('vendor', [...new Set(items.map(i => i.vendor).filter(Boolean))].sort((a, b) => a.localeCompare(b)), state.vendors, e.target.value);
});
document.getElementById('designer-search').addEventListener('input', e => {
  paintMS('designer', [...new Set(items.map(i => i.designer).filter(Boolean))].sort((a, b) => a.localeCompare(b)), state.designers, e.target.value);
});
document.getElementById('io-with-photos').addEventListener('change', doExport);
document.getElementById('f-primary-upload').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = await resizeImageFile(f);
    formPhotos.primary = d;
    const p = document.getElementById('f-primary-preview'); p.src = d; p.hidden = false;
  } catch (err) { toast(err.message); }
});
document.getElementById('f-extra-upload').addEventListener('change', async e => {
  for (const f of e.target.files) {
    try { formPhotos.extra.push(await resizeImageFile(f)); } catch (err) { toast(err.message); }
  }
  renderExtraPreview();
});
document.querySelectorAll('#tbl thead th[data-sk]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.sk === 'price' ? 'price' : th.dataset.sk;
    const cur = state.sort.split('-');
    state.sort = k + '-' + (cur[0] === k && cur[1] === 'asc' ? 'desc' : 'asc');
    render();
  });
});

bootstrap();

/* Exposed for automated testing and console debugging. */
window.__app = {
  get items() { return items; }, set items(v) { items = v; },
  get formPriority() { return formPriority; },
  get storageMode() { return storageMode; },
  openForm, detailHtml, render, getPhotos, saveRecords,
  compsFor, compStats, compValue,
  hasCustomizations, sortedCustomizations, migrateCustomizations,
  get formCompFor() { return formCompFor; },
  get formCustomizations() { return formCustomizations; }
};

</script>
</body>
</html>
